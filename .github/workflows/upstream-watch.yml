name: upstream-watch

# Weekly: fail loudly if upstream has published a stable release newer than the tag in images/*.env (VictoriaTraces,
# Grafana and Tailscale, rebuilt here) or watch/*.env (VictoriaLogs, watched only). For VictoriaTraces that is the signal to
# check the release, then re-pin consumers to upstream's own image and archive this repository; for VictoriaLogs, to
# check its image's scan, re-pin the store and bump the watch tag (the rebuild stays). For Grafana, a newer release
# of Grafana, of the VictoriaLogs data source or of the Jaeger data source is the signal to re-pin the recipe and
# rebuild. For Tailscale, to scan upstream's image of the release and, if it passes the gate, re-pin consumers to it
# and delete the Tailscale recipe; the same for the node-npm and valkey wrappers (psql has no release feed: its
# definition's note is printed). Opens nothing, writes nothing.
on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    name: upstream release check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare upstream releases with our base tags
        run: python3 scripts/upstream_watch.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
